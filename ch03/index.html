<script>
const CH = {"id": "ch03", "num": "3", "title": "Analysis of Ethical Frameworks for AI", "summary": "How the major AI ethics frameworks compare: shared values, uneven practice, AI as a sociotechnical system, turning principles into practice, internal audits and adaptive governance.", "source": "Based on Chapter 3 of Engineering Ethics of AI by Design by Prof Muthu Ramachandran (Springer).", "outcomes": ["Name the major frameworks and who is behind each one", "Explain why frameworks share values but differ in practice", "Explain what it means to see AI as a sociotechnical system", "Turn a principle into a requirement, a test and an audit check", "Compare how frameworks would judge facial recognition and hiring tools"], "watch": [{"k": "Read", "t": "EU Ethics Guidelines for Trustworthy AI", "u": "https://digital-strategy.ec.europa.eu/en/library/ethics-guidelines-trustworthy-ai", "d": "The European Commission expert group's guidelines."}, {"k": "Read", "t": "OECD AI Principles", "u": "https://oecd.ai/en/ai-principles", "d": "Principles agreed by OECD member countries and partners."}, {"k": "Read", "t": "UNESCO Recommendation on the Ethics of AI", "u": "https://www.unesco.org/en/artificial-intelligence/recommendation-ethics", "d": "The UN agency's global recommendation."}, {"k": "Read", "t": "Raji et al. (2020): Closing the AI Accountability Gap", "u": "https://arxiv.org/abs/2001.00973", "d": "A framework for auditing AI systems from inside the organisation."}, {"k": "Try", "t": "Lab: Ethics checklist and audit builder", "u": "../labs/checklist/index.html", "d": "Build your own AI ethics checklist or a mock audit for a chatbot."}, {"k": "Try", "t": "Class activities and assignments", "u": "../activities/index.html", "d": "Debates, case analyses, essays and audits for each chapter."}], "starter": [{"q": "Which organisation produced the \"Ethically Aligned Design\" framework?", "o": ["IEEE", "OECD", "UNESCO"], "a": 0, "e": ""}, {"q": "What is a common criticism of high-level AI principles?", "o": ["They are too detailed", "They are hard to enforce and apply in practice", "They ban all AI"], "a": 1, "e": ""}, {"q": "What does \"sociotechnical\" mean?", "o": ["Only about software", "Only about society", "People, processes and technology working together"], "a": 2, "e": ""}], "lessons": [{"title": "Shared values across frameworks", "minutes": 2, "slides": [{"scene": "circles", "steps": [0, 0, 0, 0], "say": ["Welcome to Chapter 3, Analysis of Ethical Frameworks for AI. Many organisations around the world have written AI ethics frameworks. In this chapter we compare them.", "Four you will meet often come from the European Union, the OECD, which is a group of governments, IEEE, the engineering professional body, and UNESCO, the United Nations agency for education, science and culture.", "Look at the middle of the scene. Where the circles overlap are the shared values. Across these major frameworks, the same ideas keep appearing: fairness, accountability and transparency.", "That is good news. It means there is broad agreement, around the world, on what ethical AI should look like. Frameworks give structure for putting those values into practice."]}], "keyPoint": "Major frameworks from the EU, OECD, IEEE and UNESCO share core values, especially fairness, accountability and transparency. They give structure for putting these values into practice.", "plain": ["Many groups have written AI ethics frameworks.", "The main ones share values: fairness, accountability, transparency.", "Frameworks give structure for putting those values into practice."], "check": {"q": "Which values does the chapter say ethical AI frameworks support?", "o": ["Speed, profit and growth", "Fairness, accountability and transparency", "Secrecy and control"], "a": 1, "e": "Frameworks support fairness, accountability and transparency, which appear across the major ones.", "retry": {"q": "The OECD is best described as…", "o": ["A group of governments", "A technology company", "A university"], "a": 0, "e": "The OECD is an international organisation of member governments."}}, "scenario": {"title": "The policy draft", "setting": "Your organisation is writing its first AI policy. A colleague worries that reading four frameworks will mean four conflicting sets of values.", "steps": [{"prompt": "What can you reassure them about?", "choices": [{"t": "The major frameworks share core values like fairness, accountability and transparency", "s": 2, "fb": "Right. The shared values give a firm starting point."}, {"t": "Each framework has completely different values", "s": 0, "fb": "No. The chapter stresses the shared values."}, {"t": "Frameworks do not matter", "s": 0, "fb": "They give structure for putting values into practice."}]}, {"prompt": "Which values should the policy start from?", "choices": [{"t": "Whatever the marketing team prefers", "s": 0, "fb": "Start from values with broad agreement."}, {"t": "Fairness, accountability and transparency, then the detail for your setting", "s": 2, "fb": "Right. Begin with the shared core, then adapt."}, {"t": "Only transparency", "s": 1, "fb": "Transparency is one of them, but not the whole set."}]}]}}, {"title": "Fragmentation, universality and adaptive governance", "minutes": 2, "slides": [{"scene": "circles", "steps": [0, 1, 1, 2, 2], "say": ["If the values are shared, why is ethical AI still so hard? Because agreeing on values is not the same as acting on them.", "Watch the circles drift apart. In practice, implementation is inconsistent. Frameworks differ in how they turn values into action, how they are enforced, and in their focus. Some are written for particular sectors.", "This tension is called fragmentation versus universality. The values are near universal. The ways of applying them are fragmented.", "The chapter's answer is dynamic, adaptive governance. AI changes quickly, so the rules and oversight around it must keep being reviewed and updated.", "Think of it as a ring around everything: a commitment to keep checking, learning and adjusting."]}], "keyPoint": "Frameworks agree on values but differ in how they are applied and enforced. This is fragmentation versus universality. Governance must be dynamic and adaptive.", "plain": ["Universality: the values are shared almost everywhere.", "Fragmentation: putting them into practice differs a lot.", "Adaptive governance: keep reviewing and updating the rules as AI changes."], "check": {"q": "What does \"fragmentation versus universality\" describe?", "o": ["Shared values, but very different ways of applying them", "Computers breaking into pieces", "One framework for every country"], "a": 0, "e": "The values are near universal, while practice is fragmented.", "retry": {"q": "Why must AI governance be adaptive?", "o": ["Because AI and its uses keep changing", "Because rules are never needed", "Because adaptive means cheaper"], "a": 0, "e": "Governance has to keep up with a fast-changing technology."}}, "scenario": {"title": "Two offices, two rulebooks", "setting": "Your company has teams in two regions. Each follows a different AI framework, and they argue over which is right.", "steps": [{"prompt": "What is the best way to frame the problem?", "choices": [{"t": "The values largely match; the difference is in how each framework is applied and enforced", "s": 2, "fb": "Right. That is fragmentation versus universality."}, {"t": "One team must be unethical", "s": 0, "fb": "Not necessarily. The values are largely shared."}, {"t": "Frameworks are pointless", "s": 0, "fb": "They give structure; they just differ in practice."}]}, {"prompt": "How should the company keep its approach up to date?", "choices": [{"t": "Write a policy once and never change it", "s": 0, "fb": "AI changes quickly. A fixed policy soon falls behind."}, {"t": "Set regular reviews to update the policy as AI and the rules change", "s": 2, "fb": "Right. That is adaptive governance."}, {"t": "Wait for a problem, then react", "s": 1, "fb": "Reacting is better than nothing, but adaptive governance plans regular reviews."}]}]}}, {"title": "AI as a sociotechnical system", "minutes": 2, "slides": [{"scene": "sociotech", "steps": [0, 1, 2, 3, 3], "say": ["Here is a key insight from the chapter. AI is not just code. It is a sociotechnical system. That means people, processes and technology working together.", "At the centre is the AI model. Around it is the technology it runs on: the data, the computers and the software.", "Around that are processes and rules: who decides to use it, who checks it, who signs it off.", "And around everything are people and society: the users, the people affected by its decisions, the culture and the law.", "So an ethics problem can start in any layer. A perfect model can still cause harm if it is used in the wrong way or with no one checking. That is why ethics must look at the whole system."]}], "keyPoint": "AI is a sociotechnical system: the model, the technology, the processes and the people around it. Ethics must look at the whole system, not just the code.", "plain": ["Socio means people and society. Technical means the technology.", "An AI system includes data, computers, processes, users and the people affected.", "Problems can start in any layer, so check them all."], "check": {"q": "Why does the chapter call AI a sociotechnical system?", "o": ["Because it only runs on social media", "Because it combines people, processes and technology", "Because it is built by sociologists"], "a": 1, "e": "AI works inside a web of people, processes and technology.", "retry": {"q": "A well-built model causes harm because staff use it for a job it was not designed for. Which layer did the problem start in?", "o": ["Processes and people", "The computer chips", "None"], "a": 0, "e": "The model was fine; the problem was in how people and processes used it."}}, "scenario": {"title": "The perfect model", "setting": "Your team's model passed every technical test. Six months later, complaints arrive: staff are using it to make decisions it was never meant for.", "steps": [{"prompt": "Where is the problem?", "choices": [{"t": "In the processes and people around the model", "s": 2, "fb": "Right. The technology worked; the system around it did not."}, {"t": "Only in the code", "s": 0, "fb": "The code passed its tests. The issue is how it is used."}, {"t": "Nowhere: the model is perfect", "s": 0, "fb": "A good model inside a poor process can still harm people."}]}, {"prompt": "What should you change?", "choices": [{"t": "Retrain the model", "s": 1, "fb": "That may help, but the main fix is in how it is used."}, {"t": "Set clear rules on what it may be used for, train staff, and check use regularly", "s": 2, "fb": "Right. Fix the process and people layers."}, {"t": "Delete the complaints", "s": 0, "fb": "That hides the harm."}]}]}}, {"title": "From principles to practice", "minutes": 2, "slides": [{"scene": "ladder", "steps": [0, 0, 1, 2, 3, 3], "say": ["A principle like \"be fair\" is a good start. But how do you know whether a real system is fair? You have to operationalise it: turn it into concrete steps that people can follow and check.", "Picture a ladder from abstract to concrete. At the bottom is the principle: be fair.", "Next is a requirement. For a loan system it might be: approval rates must not differ unfairly between groups.", "Next is a test that measures it: compare approval rates for each group.", "At the top is the audit: someone checks that the tests were run, and what they found. The chapter points to internal auditing, described by Raji and colleagues, where an organisation audits its own AI systems from start to finish.", "Practical tools like these are how abstract principles become real."]}], "keyPoint": "Operationalising means turning a principle into a requirement, a test and an audit check. Internal auditing, as described by Raji and colleagues, checks that this really happened.", "plain": ["Principle: what we value, such as fairness.", "Requirement and test: what the system must do, and how we measure it.", "Audit: someone checks that the tests were done and what they showed."], "activity": {"type": "sort", "title": "Climb the ladder", "prompt": "Put each statement on the right rung for a loan approval system.", "buckets": [{"t": "Principle"}, {"t": "Requirement"}, {"t": "Test"}, {"t": "Audit"}], "items": [{"t": "Be fair to all applicants", "b": 0}, {"t": "Approval rates must not differ unfairly between groups", "b": 1}, {"t": "Compare approval rates for each group every month", "b": 2}, {"t": "An internal team checks the monthly comparisons were done and acted on", "b": 3}], "explain": "Each rung makes the one below it concrete enough to check."}, "check": {"q": "What does \"operationalising\" a principle mean?", "o": ["Turning it into concrete steps that can be followed and checked", "Writing it in capital letters", "Asking the AI to follow it"], "a": 0, "e": "Operationalising turns an abstract principle into requirements, tests and checks.", "retry": {"q": "In internal auditing, who audits the AI system?", "o": ["The organisation itself", "Only the public", "No one"], "a": 0, "e": "Internal auditing is carried out inside the organisation."}}, "scenario": {"title": "The fairness promise", "setting": "Your company website says \"Our AI is fair.\" A journalist asks how you know.", "steps": [{"prompt": "What would make the claim believable?", "choices": [{"t": "Show the fairness requirement, the tests that measure it, and the audit results", "s": 2, "fb": "Right. That is the principle made concrete and checked."}, {"t": "Repeat that the AI is fair", "s": 0, "fb": "A promise without evidence is not convincing."}, {"t": "Say the supplier promised", "s": 1, "fb": "A supplier's word helps a little, but you need your own tests and audit."}]}, {"prompt": "Who should check that the fairness tests were done?", "choices": [{"t": "An internal audit team", "s": 2, "fb": "Right. Internal auditing checks the whole process from inside."}, {"t": "Nobody", "s": 0, "fb": "Then nobody knows if the tests happened."}, {"t": "The AI itself", "s": 0, "fb": "The system cannot audit itself."}]}]}}, {"title": "Comparing frameworks on real cases", "minutes": 3, "slides": [{"scene": "circles", "opts": {"names": ["EU", "IEEE", "UNESCO", "OECD"]}, "steps": [0, 0, 1, 2], "say": ["Let's apply all this. The chapter suggests two cases. Case one: facial recognition in public places, looked at through the EU, IEEE and UNESCO frameworks.", "Each framework cares about fairness, accountability and transparency. Your task is to ask how each one would judge a camera system watching a city square.", "You may find they agree on the concerns but differ in emphasis and in how firmly they can be enforced. A common criticism of the OECD principles, for example, is limited enforceability in countries that are not members.", "Case two: algorithmic hiring tools. Compare what different frameworks say about bias and fairness. Then build your own AI ethics checklist that draws on several frameworks. The checklist lab in this course will help."]}], "keyPoint": "The same AI system can be judged differently depending on the framework. Compare them on real cases, note where they agree and differ, and build a checklist that draws on several.", "plain": ["Pick a case, such as facial recognition or a hiring tool.", "Ask how each framework would judge it.", "Note agreements and differences, then build your own checklist."], "activity": {"type": "sort", "title": "Who is behind it?", "prompt": "Sort each framework or initiative by who produced it.", "buckets": [{"t": "Governments and intergovernmental bodies", "d": ""}, {"t": "Professional and research bodies", "d": ""}, {"t": "Industry", "d": ""}, {"t": "National initiative", "d": ""}], "items": [{"t": "EU Guidelines for Trustworthy AI", "b": 0}, {"t": "OECD AI Principles", "b": 0}, {"t": "UNESCO Recommendation", "b": 0}, {"t": "IEEE Ethically Aligned Design", "b": 1}, {"t": "AI Now reports (focus on social impacts)", "b": 1}, {"t": "Partnership on AI", "b": 2}, {"t": "Montreal Declaration", "b": 3}], "explain": "Who writes a framework shapes its focus and how it can be enforced."}, "check": {"q": "Which body is primarily driven by industry collaboration?", "o": ["UNESCO", "The Montreal Declaration", "The Partnership on AI"], "a": 2, "e": "The Partnership on AI is primarily driven by industry collaboration.", "retry": {"q": "What is a common critique of the OECD AI Principles?", "o": ["Too focused on robotics", "Limited enforceability in non-member states", "Only about cybersecurity"], "a": 1, "e": "A common critique is limited enforceability outside member countries."}}, "scenario": {"title": "Cameras in the square", "setting": "A city council asks your team to compare frameworks before it decides on facial recognition in its main square.", "steps": [{"prompt": "How should you start the comparison?", "choices": [{"t": "Pick whichever framework allows the cameras", "s": 0, "fb": "That decides the answer before the analysis."}, {"t": "List the concerns each framework raises, such as fairness, accountability and transparency, then compare", "s": 2, "fb": "Right. Compare the concerns side by side."}, {"t": "Use one framework only", "s": 1, "fb": "One framework is a start, but the task is to compare."}]}, {"prompt": "Your comparison shows the frameworks agree on the concerns but differ in how firmly they can be enforced. What do you recommend?", "choices": [{"t": "Build a checklist that draws on all of them, and plan regular reviews", "s": 2, "fb": "Right. A combined checklist plus adaptive governance."}, {"t": "Ignore the frameworks", "s": 0, "fb": "They contain the shared values you need."}, {"t": "Wait until all frameworks become law", "s": 0, "fb": "That may never happen. Act on the shared values now."}]}]}, "lab": {"t": "Open the checklist builder", "u": "../labs/checklist/index.html", "d": "Build your own AI ethics checklist that draws on several frameworks."}}], "test": [{"q": "Which organisation authored the \"Ethically Aligned Design\" framework?", "o": ["OECD", "IEEE", "EU", "UNESCO"], "a": 1, "e": "IEEE authored Ethically Aligned Design.", "lesson": 4}, {"q": "Which focus is most emphasised in the AI Now reports?", "o": ["Accountability", "Privacy", "Social and labour impacts", "Transparency"], "a": 2, "e": "The AI Now reports focus on social and labour impacts.", "lesson": 4}, {"q": "What is a common critique of the OECD AI Principles?", "o": ["Limited enforceability in non-member states", "Too focused on cybersecurity", "Lack of any principles", "Focused only on robotics"], "a": 0, "e": "A common critique is limited enforceability in non-member states.", "lesson": 4}, {"q": "The Montreal Declaration is best described as…", "o": ["A government regulation", "A corporate ethics charter", "An international treaty", "A national initiative promoting AI responsibility"], "a": 3, "e": "It is described as a national initiative promoting AI responsibility.", "lesson": 4}, {"q": "The Partnership on AI is primarily driven by…", "o": ["Industry collaboration", "Academia", "Government agencies", "Non-profit advocacy groups"], "a": 0, "e": "It is primarily driven by industry collaboration.", "lesson": 4}, {"q": "Frameworks share values but differ in how they are applied. What is this called?", "o": ["Fragmentation versus universality", "Deep learning", "Beneficence"], "a": 0, "e": "Universal values, fragmented practice.", "lesson": 1}, {"q": "A model passes its tests, but harm comes from how staff use it. Which idea explains this?", "o": ["AI is only code", "AI is a sociotechnical system", "The model is ASI"], "a": 1, "e": "People, processes and technology work together, and problems can start in any layer.", "lesson": 2}, {"q": "\"Compare approval rates for each group every month\" is which rung of the ladder?", "o": ["Principle", "Audit", "Test"], "a": 2, "e": "It measures the requirement, so it is a test.", "lesson": 3}]};
