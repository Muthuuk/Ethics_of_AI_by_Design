const CH = {"id": "ch02", "num": "2", "title": "Core Ethical Principles in AI", "summary": "The five core principles in depth, why they matter, the tools that put them into practice, three real-world cases, and the action steps for every project.", "source": "Based on Chapter 2 of Engineering Ethics of AI by Design by Prof Muthu Ramachandran (Springer).", "outcomes": ["Explain the five core principles in one plain sentence each", "Describe what goes wrong when a principle is neglected", "Choose the right tool: Ethics by Design, checklists and scorecards, or stakeholder mapping", "Name the principles at risk in hiring, healthcare and predictive policing cases", "Plan ethics reviews, inclusive data and documentation across a project"], "watch": [{"k": "Video", "t": "Coded Bias (PBS Independent Lens)", "u": "https://www.pbs.org/independentlens/documentaries/coded-bias/", "d": "Documentary on bias in facial recognition and the use of AI in surveillance."}, {"k": "Video", "t": "Joy Buolamwini: How I'm fighting bias in algorithms (TED)", "u": "https://www.ted.com/talks/joy_buolamwini_how_i_m_fighting_bias_in_algorithms", "d": "A short talk on how face-analysis software failed to see her face, and what she did about it."}, {"k": "Read", "t": "ACM Code of Ethics and Professional Conduct", "u": "https://www.acm.org/code-of-ethics", "d": "The computing profession's code of ethics."}, {"k": "Try", "t": "Lab: Ethics checklist and audit builder", "u": "../labs/checklist/index.html", "d": "Build your own AI ethics checklist or a mock audit for a chatbot."}, {"k": "Try", "t": "Class activities and assignments", "u": "../activities/index.html", "d": "Debates, case analyses, essays and audits for each chapter."}], "starter": [{"q": "Which principle is about someone being answerable for what an AI does?", "o": ["Accountability", "Transparency", "Privacy"], "a": 0, "e": ""}, {"q": "What does non-maleficence mean?", "o": ["Do good", "Do no harm", "Do it fast"], "a": 1, "e": ""}, {"q": "Who should a stakeholder map include?", "o": ["Only the developers", "Only paying customers", "Everyone who builds, uses or is affected by the system"], "a": 2, "e": ""}], "lessons": [{"title": "Transparency and accountability", "minutes": 2, "slides": [{"scene": "spheres", "opts": {"names": ["Transparency", "Fairness", "Accountability", "Privacy", "Non-maleficence"], "subs": ["Clarity in how decisions are made", "Avoiding discriminatory outcomes", "Responsibility for AI outcomes", "Data protection and consent", "Do no harm"]}, "steps": [-1, 0, 0, 2, 2, 5], "say": ["Welcome to Chapter 2, Core Ethical Principles in AI. In this chapter we unpack the five principles one by one, then put them to work. Let's start with two that are often confused.", "Transparency means clarity in how an AI system makes its decisions. Can the people affected, and the people in charge, see what the system is doing and why?", "Picture a bank's AI that refuses your loan. If the bank can tell you the main reasons, and you can question them, the system is transparent. If nobody can say why, it is not.", "Accountability is different. It means someone takes responsibility for the AI's outcomes. When something goes wrong, there is a named person or team who must answer for it and put it right.", "So transparency is about seeing. Accountability is about answering. You can have one without the other. A system might be easy to explain, yet nobody owns its mistakes.", "Good AI needs both."]}], "keyPoint": "Transparency means clarity in how an AI makes decisions. Accountability means someone is responsible for its outcomes. One is about seeing, the other about answering.", "plain": ["Transparency: you can see and understand how it decided.", "Accountability: a named person or team answers for the result.", "A system can be explainable yet still have nobody accountable."], "check": {"q": "A council's AI wrongly cuts someone's benefits. The council can explain the decision, but no team will take responsibility for fixing it. Which principle is missing?", "o": ["Transparency", "Privacy", "Accountability"], "a": 2, "e": "The decision can be explained, so transparency is there. What is missing is someone answerable for the outcome.", "retry": {"q": "Transparency is mainly about…", "o": ["Clarity in how decisions are made", "Who pays for the system", "Keeping data secret"], "a": 0, "e": "Transparency is clarity in algorithmic decision-making."}}, "scenario": {"title": "The refused loan", "setting": "Priya applies for a small loan online and is refused in seconds. She calls the bank to ask why.", "steps": [{"prompt": "The call handler says: \"The computer decided, we can't see why.\" Which principle is failing?", "choices": [{"t": "Transparency", "s": 2, "fb": "Right. Priya cannot see or understand the reasons for a decision about her."}, {"t": "Fairness", "s": 1, "fb": "Possibly, but nobody can tell yet. The clear failure is that the decision cannot be explained."}, {"t": "None: computers are always right", "s": 0, "fb": "No. AI systems make mistakes, which is why people need explanations."}]}, {"prompt": "Priya asks who she can appeal to. What would good accountability look like?", "choices": [{"t": "A named team reviews her case and can change the decision", "s": 2, "fb": "Right. Accountability means someone owns the outcome and can put it right."}, {"t": "An automatic email saying the decision is final", "s": 0, "fb": "That shuts the door. Nobody is answering for the outcome."}, {"t": "Telling her to apply again next year", "s": 0, "fb": "That avoids responsibility for the original decision."}]}]}}, {"title": "Fairness, privacy and doing no harm", "minutes": 2, "slides": [{"scene": "spheres", "opts": {"names": ["Transparency", "Fairness", "Accountability", "Privacy", "Non-maleficence"], "subs": ["Clarity in how decisions are made", "Avoiding discriminatory outcomes", "Responsibility for AI outcomes", "Data protection and consent", "Do no harm"]}, "steps": [1, 1, 3, 3, 4, 4], "say": ["Now the other three principles. Fairness means avoiding discriminatory outcomes. An AI system should not treat people worse because of who they are.", "Unfairness often hides in data. If a system learned from records where some groups were treated badly, it can repeat that treatment, quietly and at scale.", "Privacy means respect for data protection and consent. People's personal information should be kept safe, and used only in ways they have agreed to.", "Consent matters. Collecting data is not enough on its own. People should know what is being collected, why, and have a real choice.", "Non-maleficence means do no harm. Before an AI system is used, ask: who could be hurt by it, and how badly?", "These principles apply everywhere, in healthcare, in finance and in government."]}], "keyPoint": "Fairness means avoiding discriminatory outcomes. Privacy means data protection and consent. Non-maleficence means do no harm. All three apply in every sector.", "plain": ["Fairness: no group is treated worse because of who they are.", "Privacy: personal data is protected and used only with consent.", "Non-maleficence: think about who could be harmed before you use the system."], "check": {"q": "A fitness app sells users' location data to advertisers without telling them. Which principle is broken most clearly?", "o": ["Privacy: data protection and consent", "Transparency of the screen design", "Non-maleficence only"], "a": 0, "e": "Using personal data without people's knowledge or agreement breaks privacy, which includes consent.", "retry": {"q": "Fairness in AI means…", "o": ["Avoiding discriminatory outcomes", "Making every result identical", "Charging everyone the same price"], "a": 0, "e": "Fairness is about avoiding discriminatory outcomes."}}, "scenario": {"title": "The school app", "setting": "A school plans an AI app that predicts which pupils might need extra support. It wants to use pupils' home addresses and family details.", "steps": [{"prompt": "What should the school check first about the data?", "choices": [{"t": "Whether families know, have agreed, and the data is protected", "s": 2, "fb": "Right. That is privacy: data protection and consent."}, {"t": "Whether the app looks modern", "s": 0, "fb": "Looks do not protect pupils' data."}, {"t": "Nothing, because schools already hold the data", "s": 1, "fb": "Holding data for one purpose does not mean consent to use it for another."}]}, {"prompt": "Early tests show the app flags pupils from some neighbourhoods far more often. What principle is now at risk?", "choices": [{"t": "Fairness", "s": 2, "fb": "Right. Outcomes that fall harder on some groups may be discriminatory."}, {"t": "Speed", "s": 0, "fb": "This is about who is affected, not speed."}, {"t": "None: the data is the data", "s": 0, "fb": "Data can carry old unfairness. That is why outcomes must be checked."}]}]}}, {"title": "Why principles matter", "minutes": 2, "slides": [{"scene": "dominoes", "steps": [0, 1, 2, 3, 4, 9], "say": ["Why go to all this effort? The chapter gives three reasons. Think of a row of dominoes.", "It starts when one principle is ignored. Perhaps nobody checks the data for fairness.", "The first domino tips the next: people are harmed. Someone is refused a job, a treatment or a fair hearing.", "Then trust falls. When the public hears about AI causing harm, they stop trusting it, even the systems that work well.", "And finally, rules and standards are broken. Organisations face regulators and the costs of putting things right.", "Following the principles keeps every domino standing. It prevents societal harm, builds public trust in AI, and keeps you in line with regulations and global standards."]}], "keyPoint": "Principles matter for three reasons: they prevent harm to society, build public trust in AI, and keep organisations in line with regulations and global standards.", "plain": ["Ignoring a principle can harm real people.", "Harm damages public trust in AI.", "It can also break regulations and standards. Following the rules is one benefit, not the whole of ethics."], "check": {"q": "Which three reasons does the chapter give for why principles matter?", "o": ["Speed, cost and style", "Preventing harm, building public trust, and aligning with regulations and standards", "Marketing, sales and branding"], "a": 1, "e": "Those are the three reasons on the slide.", "retry": {"q": "Is meeting the regulations the same as being ethical?", "o": ["Yes, always", "No: it is one benefit, alongside preventing harm and building trust", "Regulations do not matter"], "a": 1, "e": "The chapter lists regulation as one benefit among three."}}, "scenario": {"title": "The board meeting", "setting": "A company director says: \"We passed our legal check, so we don't need to worry about ethics.\"", "steps": [{"prompt": "What is the best response?", "choices": [{"t": "Agreed, the legal check is enough", "s": 0, "fb": "Not quite. Harm and lost trust can happen even when the rules are met."}, {"t": "Legal checks matter, but we also need to prevent harm and keep public trust", "s": 2, "fb": "Right. The chapter treats regulation as one of three reasons, not the only one."}, {"t": "Ethics is only for universities", "s": 0, "fb": "Ethics matters wherever AI affects people."}]}, {"prompt": "A news story shows a rival company's AI harmed customers. Why might that affect your company too?", "choices": [{"t": "Public trust in AI as a whole can fall", "s": 2, "fb": "Right. Harm anywhere can lower trust everywhere."}, {"t": "It cannot affect us", "s": 0, "fb": "Trust in AI is shared across the sector."}, {"t": "Only because of share prices", "s": 1, "fb": "Partly. The wider effect is on public trust."}]}]}}, {"title": "Tools: Ethics by Design, scorecards and stakeholder maps", "minutes": 3, "slides": [{"scene": "orbit", "steps": [-1, -1, 0, 1, 2, 5], "say": ["How do we put the principles into practice? The chapter gives three kinds of tool.", "First, the Ethics by Design method: plan ethics into the system from the very first design meeting. Second, ethical checklists and scorecards. A checklist makes sure nothing is missed. A scorecard rates a system against each principle, so you can see where it is weak.", "Third, stakeholder mapping. Put the AI system in the middle and ask who is around it. The users who work with it.", "The people affected by its decisions, who may never see the system at all.", "The developers who build it, the organisation that runs it, and the regulators who oversee it.", "Inclusive design means bringing those outer circles into the design room: involve the people affected, not just the people building. And remember, no tool works by itself. Critique your tools and adapt them to your project."]}], "keyPoint": "Three kinds of tool: the Ethics by Design method, checklists and scorecards, and stakeholder mapping with inclusive design. Critique and adapt them; ticking boxes alone is not enough.", "plain": ["Ethics by Design: plan ethics in from day one.", "Checklists catch gaps. Scorecards show weak spots against each principle.", "Stakeholder maps show everyone affected. Inclusive design brings them into the process."], "activity": {"type": "sort", "title": "Pick the right tool", "prompt": "Which kind of tool fits each job?", "buckets": [{"t": "Ethics by Design", "d": "The method"}, {"t": "Checklists and scorecards", "d": "Measuring tools"}, {"t": "Stakeholder mapping and inclusive design", "d": "People tools"}], "items": [{"t": "Plan ethics in from the first design meeting", "b": 0}, {"t": "Rate the system from 1 to 5 against each principle", "b": 1}, {"t": "List everyone who is affected by a new app", "b": 2}, {"t": "Tick off required checks before launch", "b": 1}, {"t": "Invite people affected to test early designs", "b": 2}, {"t": "Make ethics part of every stage, not an add-on", "b": 0}], "explain": "The best projects use all three together."}, "check": {"q": "A team wants to see which principles its chatbot is weakest on. Which tool fits best?", "o": ["A stakeholder map", "A scorecard", "A press release"], "a": 1, "e": "A scorecard rates the system against each principle, so weak spots stand out.", "retry": {"q": "What does inclusive design add?", "o": ["Bringing the people affected into the design process", "Making the screen colourful", "Using more data"], "a": 0, "e": "Inclusive design involves the people affected, not just the builders."}}, "scenario": {"title": "The housing app", "setting": "You are designing an AI app that helps a housing office decide who gets repairs first.", "steps": [{"prompt": "Who belongs on your stakeholder map?", "choices": [{"t": "Just the housing office staff", "s": 1, "fb": "They are users, but the tenants affected by the decisions matter most."}, {"t": "Staff, tenants affected by the decisions, developers, the housing organisation and regulators", "s": 2, "fb": "Right. Everyone who uses, builds, runs, oversees or is affected by the system."}, {"t": "Only the software company", "s": 0, "fb": "That leaves out the people the app is for."}]}, {"prompt": "Your checklist is all ticked. A colleague says you are done. What do you say?", "choices": [{"t": "Agree and launch", "s": 0, "fb": "A ticked checklist does not prove the system is ethical."}, {"t": "Check with tenants too, and critique the checklist itself: did it miss anything?", "s": 2, "fb": "Right. The chapter asks you to critique and adapt your tools."}, {"t": "Add more boxes to tick", "s": 1, "fb": "Maybe, but first check with the people affected."}]}]}}, {"title": "Three cases: hiring, healthcare and policing", "minutes": 3, "slides": [{"scene": "spheres", "opts": {"names": ["Transparency", "Fairness", "Accountability", "Privacy", "Non-maleficence"], "subs": ["Clarity in how decisions are made", "Avoiding discriminatory outcomes", "Responsibility for AI outcomes", "Data protection and consent", "Do no harm"]}, "steps": [1, 1, 2, 4, 0, 3, 5], "say": ["Let's walk through three cases. For each one, spot the principles at risk, then think of a remedy.", "Case one: AI in hiring. A screening tool learns from past hiring records. If those records favour one group, so will the tool. The principle at risk is fairness, and the issue is bias.", "Case two: healthcare algorithms. An AI helps decide which patients get extra care. If it gets this wrong, who is responsible? The principles at risk are accountability,", "and non-maleficence, because a wrong decision here can directly harm a patient.", "Case three: predictive policing. An AI suggests where police should patrol. Residents cannot see why their area is targeted, so transparency is at risk.", "And it may use a lot of data about people and places, which raises privacy concerns.", "Notice that each case touches more than one principle. That is normal. A good remedy addresses all of them."]}], "keyPoint": "Hiring AI puts fairness at risk; healthcare algorithms raise accountability and harm; predictive policing raises transparency and privacy. Most cases touch several principles at once.", "plain": ["Hiring: biased data leads to unfair shortlists.", "Healthcare: who answers for a wrong decision, and could a patient be harmed?", "Policing: can residents see why, and is their data handled properly?"], "activity": {"type": "sort", "title": "Which case is it?", "prompt": "Each problem comes from one of the three cases. Sort them.", "buckets": [{"t": "AI in hiring"}, {"t": "Healthcare algorithm"}, {"t": "Predictive policing"}], "items": [{"t": "Shortlists favour one group of applicants", "b": 0}, {"t": "Nobody owns a wrong treatment suggestion", "b": 1}, {"t": "Residents cannot find out why their street is targeted", "b": 2}, {"t": "Old records of who was hired teach the AI", "b": 0}, {"t": "A missed warning leads to a patient being harmed", "b": 1}, {"t": "Data about where people live is collected without notice", "b": 2}], "explain": "Each case raises more than one principle."}, "check": {"q": "Which pair of concerns does the chapter link to predictive policing?", "o": ["Speed and cost", "Bias and fairness only", "Transparency and privacy"], "a": 2, "e": "Predictive policing is linked to transparency and privacy concerns.", "retry": {"q": "Which principles does the chapter link to healthcare algorithms?", "o": ["Accountability and harm", "Branding and design", "Privacy only"], "a": 0, "e": "Healthcare algorithms raise accountability and the risk of harm."}}, "scenario": {"title": "The patrol map", "setting": "A city plans to use an AI system that suggests where police should patrol, based on past records.", "steps": [{"prompt": "Residents ask why their streets keep appearing on the map. What would help most?", "choices": [{"t": "Explain clearly what the system uses and how it reaches its suggestions", "s": 2, "fb": "Right. That is transparency, the first concern for this case."}, {"t": "Say it is commercially confidential", "s": 0, "fb": "That leaves residents unable to understand or question decisions about them."}, {"t": "Turn off the map display", "s": 1, "fb": "That hides the output but does not explain it."}]}, {"prompt": "The supplier wants to add data from residents' phones. What is your main concern?", "choices": [{"t": "Privacy: data protection and consent", "s": 2, "fb": "Right. Collecting personal data without consent is a privacy concern."}, {"t": "The map will look busier", "s": 0, "fb": "The concern is about people's data, not the look of the map."}, {"t": "None, more data is always better", "s": 0, "fb": "More data can bring more risk to privacy and fairness."}]}]}}, {"title": "Action steps for every project", "minutes": 2, "slides": [{"scene": "lifecycle", "opts": {"mode": "gates", "head": "Ethics review at every stage"}, "steps": [-1, 0, 1, 2, 3, 4, 5], "say": ["Let's finish with what to actually do. The chapter gives three action steps you can use in any project, including your own design or capstone project.", "Step one: conduct ethics reviews at each development stage. Start when you collect data.", "Review again when you design the system,", "when you build and train it,", "when you test it,", "and when you deploy it and keep it running.", "Step two: use diverse datasets and inclusive practices, so the system learns from and works for everyone. Step three: document decisions and risk assessments. If it is written down, it can be checked, questioned and improved."]}], "keyPoint": "Three action steps: hold ethics reviews at every development stage, use diverse datasets and inclusive practices, and document decisions and risk assessments.", "plain": ["Review ethics at every stage, from data to deployment.", "Use data and practices that include everyone.", "Write down decisions and risks so they can be checked."], "check": {"q": "When should ethics reviews happen, according to the chapter?", "o": ["Only at the end", "At each development stage", "Only if there is a complaint"], "a": 1, "e": "The chapter asks for ethics reviews at each stage of development.", "retry": {"q": "Why document decisions and risk assessments?", "o": ["So they can be checked, questioned and improved", "To make the project slower", "Because nobody reads them"], "a": 0, "e": "Written decisions support accountability and improvement."}}, "scenario": {"title": "The capstone project", "setting": "Your student team is building an AI app that recommends study resources. The deadline is in six weeks.", "steps": [{"prompt": "When should the team first discuss ethics?", "choices": [{"t": "At the very start, when deciding what data to collect", "s": 2, "fb": "Right. The first review belongs at the data stage."}, {"t": "The week before the deadline", "s": 0, "fb": "Too late to change the design."}, {"t": "Only if the tutor asks", "s": 0, "fb": "Ethics reviews belong at every stage, whether or not someone asks."}]}, {"prompt": "The team's test data comes only from students on one course. What should you do?", "choices": [{"t": "Nothing, it is quicker", "s": 0, "fb": "The app may then work badly for other students."}, {"t": "Add data from a wider range of students, and write down the decision and its risks", "s": 2, "fb": "Right. Diverse data plus documentation covers two action steps at once."}, {"t": "Delete the data", "s": 1, "fb": "That avoids one risk but leaves you nothing to test with."}]}]}}], "test": [{"q": "A hospital AI can explain its advice, but no team is responsible for mistakes. Which principle is missing?", "o": ["Transparency", "Accountability", "Fairness"], "a": 1, "e": "Being explainable is transparency. Nobody answering for outcomes is a lack of accountability.", "lesson": 0}, {"q": "An app collects users' contacts without asking. Which principle is broken?", "o": ["Fairness", "Non-maleficence only", "Privacy, including consent"], "a": 2, "e": "Privacy covers data protection and consent.", "lesson": 1}, {"q": "Which is NOT one of the chapter's three reasons why principles matter?", "o": ["Preventing societal harm", "Making AI cheaper", "Building public trust"], "a": 1, "e": "The three reasons are preventing harm, building trust and aligning with regulations and standards.", "lesson": 2}, {"q": "A team lists everyone who uses, builds, runs, oversees or is affected by its system. Which tool is this?", "o": ["Stakeholder mapping", "A scorecard", "Deep learning"], "a": 0, "e": "That is a stakeholder map.", "lesson": 3}, {"q": "A screening tool favours applicants like past hires. Which case and principle is this?", "o": ["Policing and privacy", "Hiring and fairness", "Healthcare and transparency"], "a": 1, "e": "Hiring AI raises bias and fairness.", "lesson": 4}, {"q": "Residents cannot find out why an AI targets their area for patrols. Which principle is at risk?", "o": ["Transparency", "Beneficence", "Speed"], "a": 0, "e": "Predictive policing raises transparency and privacy concerns.", "lesson": 4}, {"q": "Which is one of the chapter's action steps?", "o": ["Review ethics only after launch", "Use the smallest dataset possible", "Document decisions and risk assessments"], "a": 2, "e": "The three steps: reviews at each stage, diverse data and inclusive practice, and documentation.", "lesson": 5}]};
