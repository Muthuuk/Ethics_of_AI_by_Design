<script>
const CH = {"id": "ch04", "num": "4", "title": "Ethical Challenges in AI", "summary": "Where AI goes wrong across its lifecycle: bias from unrepresentative data, the black box and accountability, privacy and surveillance, emerging challenges, and the fixes and governance that help.", "source": "Based on Chapter 4 of Engineering Ethics of AI by Design by Prof Muthu Ramachandran (Springer). Recommended readings from the chapter: Buolamwini and Gebru; the ACM Code of Ethics; Doshi-Velez and Kim; Cowls and colleagues.", "outcomes": ["Explain why ethical challenges run through the whole AI lifecycle and connect to each other", "Explain how unrepresentative data leads to bias and systemic discrimination", "Explain why the black box makes accountability hard in high-stakes uses", "Spot privacy and surveillance risks, including lack of consent", "Match each challenge to a fix: fairness-aware algorithms, explainable AI, privacy-preserving technology and ethical audits"], "watch": [{"k": "Read", "t": "Gender Shades project (MIT Media Lab)", "u": "https://www.media.mit.edu/projects/gender-shades/", "d": "The Buolamwini and Gebru study of how well commercial face-analysis tools worked across groups."}, {"k": "Video", "t": "Coded Bias (PBS Independent Lens)", "u": "https://www.pbs.org/independentlens/documentaries/coded-bias/", "d": "Documentary on bias in facial recognition and the use of AI in surveillance."}, {"k": "Read", "t": "Doshi-Velez and Kim (2017): Towards a Rigorous Science of Interpretable Machine Learning", "u": "https://arxiv.org/abs/1702.08608", "d": "Why explaining AI decisions matters and how to judge explanations."}, {"k": "Read", "t": "ACM Code of Ethics and Professional Conduct", "u": "https://www.acm.org/code-of-ethics", "d": "The computing profession's code of ethics."}, {"k": "Try", "t": "Lab: Loan approval bias", "u": "../labs/loan-bias/index.html", "d": "Build biased training data, watch the effect, then apply a fairness fix."}, {"k": "Try", "t": "Lab: Station risk spotter", "u": "../labs/risk-spotter/index.html", "d": "Find the ethical risks of facial recognition in a 3D station and choose fixes."}, {"k": "Try", "t": "Lab: Ethics checklist and audit builder", "u": "../labs/checklist/index.html", "d": "Build your own AI ethics checklist or a mock audit for a chatbot."}, {"k": "Try", "t": "Class activities and assignments", "u": "../activities/index.html", "d": "Debates, case analyses, essays and audits for each chapter."}], "starter": [{"q": "Where in an AI project can ethical problems start?", "o": ["Only when the system is switched on", "At any stage, from collecting data to deployment", "Only in the code"], "a": 1, "e": ""}, {"q": "What does it mean to call an AI system a \"black box\"?", "o": ["It is painted black", "It is hard to see how it reaches its decisions", "It is switched off"], "a": 1, "e": ""}, {"q": "A camera system identifies people in a station without telling them. What is the main concern?", "o": ["Privacy and consent", "Battery life", "Screen size"], "a": 0, "e": ""}], "lessons": [{"title": "Challenges across the AI lifecycle", "minutes": 2, "slides": [{"scene": "lifecycle", "opts": {"mode": "warnings", "risks": ["Unrepresentative data", "Hidden assumptions", "Black-box model", "Untested groups", "Surveillance, drift"], "head": "Challenges can start at every stage"}, "steps": [-1, 0, 2, 4, 5, 5], "say": ["Welcome to Chapter 4, Ethical Challenges in AI. In the last three chapters we met the principles and the frameworks. Now we look at where things actually go wrong.", "The first insight is that ethical challenges run through the entire AI lifecycle. They can start right at the beginning, when data is collected. If the data leaves people out, the problem is built in from day one.", "They can appear while the model is built and trained, for example when it becomes too complex to explain.", "And they can appear after deployment, when the system is used in ways nobody planned, or keeps changing as it learns.", "The challenges are also interrelated. Biased data makes unfair decisions. A black box makes those decisions hard to spot. And without anyone accountable, nobody fixes them.", "So ethics cannot be a single check at the end. It has to follow the system all the way through."]}], "keyPoint": "Ethical challenges span the whole AI lifecycle, from data collection to deployment, and they are interrelated: one problem often makes another worse.", "plain": ["Problems can start at any stage, not just at the end.", "They connect: bad data plus a black box plus no owner is worse than any one alone.", "So ethics has to follow the system through its whole life."], "check": {"q": "What does the chapter mean by saying ethical challenges are \"interrelated\"?", "o": ["They only happen one at a time", "One challenge can make another worse, such as bias hidden by a black box", "They are all about money"], "a": 1, "e": "Challenges connect. Biased data, an unexplainable model and no accountability reinforce each other.", "retry": {"q": "When can ethical challenges start in an AI project?", "o": ["Only after launch", "At any stage, from data collection to deployment", "Only during testing"], "a": 1, "e": "They span the entire lifecycle."}}, "scenario": {"title": "The project plan", "setting": "Your manager's plan has one ethics review, scheduled the week before launch.", "steps": [{"prompt": "What is the main risk with this plan?", "choices": [{"t": "Problems that start with the data or design will be found too late to fix easily", "s": 2, "fb": "Right. Challenges span the lifecycle, so checks must too."}, {"t": "Nothing, one review is enough", "s": 0, "fb": "One late review cannot catch problems built in at the start."}, {"t": "The review might run over time", "s": 1, "fb": "Possibly, but the bigger risk is finding deep problems too late."}]}, {"prompt": "What would you suggest instead?", "choices": [{"t": "Ethics checks at each stage, starting with the data", "s": 2, "fb": "Right. Follow the system through its whole lifecycle."}, {"t": "Skip the review entirely", "s": 0, "fb": "That removes the only check."}, {"t": "Do the review after launch instead", "s": 0, "fb": "By then people may already be harmed."}]}]}}, {"title": "Bias from unrepresentative data", "minutes": 3, "slides": [{"scene": "pipeline", "steps": [0, 1, 1, 2, 2], "say": ["The second insight is about bias. Bias in AI often comes from unrepresentative datasets: data that does not fairly reflect all the people the system will be used on.", "Watch the data in the scene. Most of it comes from one group. The model learns mostly about that group, and when it makes decisions, the other group is treated worse.", "A well-known study by Joy Buolamwini and Timnit Gebru, called Gender Shades, tested commercial tools that guess a person's gender from a photo of their face. They found much higher error rates for darker-skinned women than for lighter-skinned men. They also showed that the image collections commonly used to test such tools were made up mostly of lighter-skinned faces.", "Bias like this does not just copy old unfairness. It can reinforce systemic discrimination: unfair decisions feed back into tomorrow's data, and the pattern grows.", "That is why you should always ask who is in the data, and who is missing."]}], "keyPoint": "Bias often comes from unrepresentative data: data that leaves some groups out or under-counts them. It can reinforce systemic discrimination by feeding unfair decisions back into future data.", "plain": ["If the data is mostly about one group, the AI works best for that group.", "Gender Shades found commercial face tools made far more errors for darker-skinned women.", "Unfair decisions can feed back into the data and make the bias grow."], "check": {"q": "According to the chapter, where does bias in AI often come from?", "o": ["Unrepresentative datasets", "Slow computers", "Too many users"], "a": 0, "e": "The chapter names unrepresentative datasets as a source of bias.", "retry": {"q": "What did the Gender Shades study find?", "o": ["All tools worked equally well for everyone", "Much higher error rates for darker-skinned women", "The tools could not detect faces at all"], "a": 1, "e": "Error rates were much higher for darker-skinned women than for lighter-skinned men."}}, "scenario": {"title": "The skin-check app", "setting": "A start-up builds an app that checks photos of skin for problems. Its training photos come almost entirely from people with light skin.", "steps": [{"prompt": "What is the likely problem?", "choices": [{"t": "The app will work less well for people with darker skin", "s": 2, "fb": "Right. Unrepresentative data means poorer results for the groups left out."}, {"t": "The app will be too slow", "s": 0, "fb": "Speed is not the issue here."}, {"t": "There is no problem if the overall accuracy is high", "s": 0, "fb": "High overall accuracy can hide poor results for some groups."}]}, {"prompt": "What should the team do before launch?", "choices": [{"t": "Launch and fix it later", "s": 0, "fb": "People could be harmed in the meantime."}, {"t": "Collect more representative data and test results separately for each skin tone", "s": 2, "fb": "Right. Fix the data and measure each group."}, {"t": "Add a warning in small print", "s": 1, "fb": "Honest, but it does not fix the bias."}]}]}, "lab": {"t": "Open the loan approval bias lab", "u": "../labs/loan-bias/index.html", "d": "Introduce bias into training data, watch the effect on approvals, then apply a fairness-aware adjustment."}}, {"title": "The black box and accountability", "minutes": 2, "slides": [{"scene": "blackbox", "steps": [0, 1, 1, 2, 2], "say": ["The third insight is about accountability. Many AI systems are a black box. Information goes in, a decision comes out, and it is very hard to see why. Even the people who built it may not be able to explain a particular decision.", "That makes accountability difficult. If nobody can see why the system refused a loan or flagged a patient, how do you know if it was wrong? And who is responsible?", "The problem matters most in high-stakes applications: healthcare, justice, jobs and money, where a wrong decision can change someone's life.", "One answer is explainable AI. These are methods that open up the box, showing the main reasons behind a decision in a way people can understand and question.", "The chapter recommends reading Doshi-Velez and Kim on explainable AI, if you want to go deeper."]}], "keyPoint": "Many AI systems are a black box: hard to see inside, even for their builders. That makes accountability hard, especially in high-stakes uses. Explainable AI helps by showing the main reasons for a decision.", "plain": ["Black box: you see what goes in and what comes out, but not why.", "Without reasons, it is hard to spot mistakes or hold anyone responsible.", "Explainable AI shows the main reasons, so people can question them."], "check": {"q": "Why does the black box make accountability difficult?", "o": ["Because the box is locked", "Because nobody can easily see why a decision was made, so mistakes and responsibility are hard to pin down", "Because black boxes are expensive"], "a": 1, "e": "Without seeing the reasons, it is hard to tell whether a decision was wrong and who should answer for it.", "retry": {"q": "Where does the black box problem matter most?", "o": ["In high-stakes uses such as healthcare and justice", "In music playlists", "In weather apps"], "a": 0, "e": "High-stakes decisions can change someone's life."}}, "scenario": {"title": "The flagged patient", "setting": "A hospital AI flags a patient as low priority. A nurse disagrees, but nobody can see why the AI decided.", "steps": [{"prompt": "What should happen first?", "choices": [{"t": "Follow the AI: it is usually right", "s": 0, "fb": "Usually is not always. In high-stakes care, a person must be able to question it."}, {"t": "The nurse's concern is escalated to a responsible clinician who can override the AI", "s": 2, "fb": "Right. A person stays accountable for high-stakes decisions."}, {"t": "Turn the AI off for good", "s": 1, "fb": "That may be too much. Start by letting people check and override it."}]}, {"prompt": "What would make the AI easier to trust in future?", "choices": [{"t": "A bigger screen", "s": 0, "fb": "The problem is not the display."}, {"t": "Explainable AI that shows the main reasons for each flag", "s": 2, "fb": "Right. Reasons let staff spot and challenge mistakes."}, {"t": "Fewer staff checking it", "s": 0, "fb": "That makes accountability weaker, not stronger."}]}]}}, {"title": "Privacy and surveillance", "minutes": 2, "slides": [{"scene": "station", "steps": [0, 1, 1, 2, 3, 3], "say": ["The fourth insight is about privacy. AI systems pose significant threats to privacy, especially when they are used for surveillance, or without adequate consent.", "Picture a busy station with facial recognition cameras. Every face that passes is scanned and compared against a list.", "Most people walking through have done nothing wrong, and many do not know it is happening.", "If the system wrongly matches someone, they may be stopped and questioned. And if it works less well for some groups, those groups are wrongly stopped more often. So privacy and bias combine.", "Then there are the quieter questions. Were people told? Did they agree? How long are the faces kept, and who can see them?", "Surveillance without consent is one of the clearest ethical challenges in AI today."]}], "keyPoint": "AI poses significant threats to privacy, especially in surveillance and without adequate consent. Wrong matches and unequal accuracy can add bias on top of the privacy harm.", "plain": ["Surveillance AI can watch and identify people in public.", "People should be told, and asked, before their data is used.", "Wrong matches can fall harder on some groups."], "check": {"q": "When are AI privacy threats greatest, according to the chapter?", "o": ["When the AI is turned off", "When people agree and are told", "When AI is used for surveillance or without adequate consent"], "a": 2, "e": "Surveillance and lack of consent are named as the main privacy threats.", "retry": {"q": "Facial recognition wrongly matches people from one group more often. Which two concerns combine?", "o": ["Privacy and bias", "Speed and cost", "Design and colour"], "a": 0, "e": "Privacy harm and unequal accuracy combine."}}, "scenario": {"title": "The station trial", "setting": "A transport company plans to trial facial recognition at a station to find people on a watch list.", "steps": [{"prompt": "What should the company consider first?", "choices": [{"t": "Whether people are told, whether there is a lawful basis and consent where needed, and how long images are kept", "s": 2, "fb": "Right. Privacy and consent come first."}, {"t": "The colour of the cameras", "s": 0, "fb": "The concern is about people's data."}, {"t": "Nothing, cameras are already everywhere", "s": 0, "fb": "Ordinary cameras do not identify everyone automatically."}]}, {"prompt": "Tests show more wrong matches for some groups. What now?", "choices": [{"t": "Go ahead: some errors are normal", "s": 0, "fb": "Errors that fall harder on some groups are unfair."}, {"t": "Pause the trial until accuracy is tested and fair across groups", "s": 2, "fb": "Right. Do not deploy a system that wrongly targets some groups."}, {"t": "Only use it at night", "s": 1, "fb": "That changes when harm happens, not whether it happens."}]}]}, "lab": {"t": "Open the station risk spotter", "u": "../labs/risk-spotter/index.html", "d": "Explore the station in 3D, find each ethical risk, and choose a fix."}}, {"title": "Emerging challenges", "minutes": 2, "slides": [{"scene": "drift", "steps": [0, 1, 1, 2, 2], "say": ["The fifth insight is about what is coming next. The chapter names three emerging challenges.", "The first is adaptive bias. Some AI systems keep learning after they are launched. As they learn from new data, their behaviour can drift, and new bias can creep in, even if they were fair on day one.", "The second is autonomous decision-making. As AI systems act more on their own, fewer people check each decision before it takes effect.", "Both lead to the third: the need for continuous oversight. A system that changes and acts by itself has to be watched all the time. That means monitoring how it behaves, raising an alert when it drifts, and correcting it.", "A one-off check at launch is no longer enough."]}], "keyPoint": "Emerging challenges: adaptive bias (systems that drift as they keep learning), autonomous decision-making, and the resulting need for continuous oversight.", "plain": ["Adaptive bias: a system that keeps learning can become unfair over time.", "Autonomous decisions: the AI acts with fewer people checking.", "Continuous oversight: keep monitoring, alerting and correcting."], "check": {"q": "What is adaptive bias?", "o": ["A setting that adapts screen brightness", "Bias that only exists in the training lab", "Bias that can creep in as a system keeps learning after launch"], "a": 2, "e": "Systems that keep learning can drift and pick up new bias over time.", "retry": {"q": "Why do emerging challenges call for continuous oversight?", "o": ["Because systems that change and act alone must be watched all the time", "Because oversight is cheaper", "Because launch checks are illegal"], "a": 0, "e": "One check at launch cannot catch changes that happen later."}}, "scenario": {"title": "The learning chatbot", "setting": "A council's advice chatbot keeps learning from conversations. After six months, residents complain its answers have become rude to some groups.", "steps": [{"prompt": "What has most likely happened?", "choices": [{"t": "Adaptive bias: it learned new, unfair patterns from new data", "s": 2, "fb": "Right. A system that keeps learning can drift."}, {"t": "The residents are imagining it", "s": 0, "fb": "Complaints like these should be taken seriously and checked."}, {"t": "The server is too slow", "s": 0, "fb": "Speed does not make answers rude."}]}, {"prompt": "What should the council put in place?", "choices": [{"t": "Check it once a year", "s": 1, "fb": "Better than nothing, but drift can happen quickly."}, {"t": "Continuous monitoring with alerts, and a team who can correct or pause it", "s": 2, "fb": "Right. That is continuous oversight."}, {"t": "Let it keep learning without checks", "s": 0, "fb": "That is how the problem arose."}]}]}}, {"title": "Fixes and governance", "minutes": 3, "slides": [{"scene": "fixmap", "steps": [-1, 0, 1, 2, 3, 5], "say": ["Now the good news. The chapter names four kinds of fix, and each one pairs with a challenge.", "For bias: fairness-aware algorithms. These are designed and tested so that outcomes do not unfairly differ between groups.", "For the black box: explainable AI, which shows the main reasons for a decision.", "For privacy and surveillance: privacy-preserving technologies, which let systems learn and work while protecting personal data.", "And for systems that change and act on their own: ethical audits, which check the system regularly, together with continuous oversight.", "Finally, the seventh insight. Effective governance needs multidisciplinary collaboration: engineers, lawyers, ethicists, domain experts and the people affected, working together. And it needs proactive ethical frameworks that act before harm happens, not after."]}], "keyPoint": "Four fixes: fairness-aware algorithms, explainable AI, privacy-preserving technologies and ethical audits. Good governance is multidisciplinary and proactive, acting before harm happens.", "plain": ["Bias → fairness-aware algorithms. Black box → explainable AI.", "Privacy → privacy-preserving technologies. Change and autonomy → audits and oversight.", "Governance: many kinds of expert, acting before harm, not after."], "activity": {"type": "sort", "title": "Match the fix", "prompt": "Which fix best answers each problem?", "buckets": [{"t": "Fairness-aware algorithms"}, {"t": "Explainable AI"}, {"t": "Privacy-preserving technologies"}, {"t": "Ethical audits"}], "items": [{"t": "A loan model approves one group far less often", "b": 0}, {"t": "A patient's carer cannot find out why the AI flagged them", "b": 1}, {"t": "A health app needs to learn without exposing personal records", "b": 2}, {"t": "Nobody has checked a deployed chatbot in a year", "b": 3}, {"t": "Shortlists favour applicants like past hires", "b": 0}, {"t": "A judge asks for the reasons behind a risk score", "b": 1}], "explain": "Each fix answers a different challenge, so most systems need several."}, "check": {"q": "Which fix pairs best with the black box problem?", "o": ["Privacy-preserving technologies", "Explainable AI", "A bigger dataset"], "a": 1, "e": "Explainable AI shows the reasons behind decisions.", "retry": {"q": "What does the chapter say effective governance needs?", "o": ["Multidisciplinary collaboration and proactive frameworks", "One expert working alone", "Waiting until harm happens"], "a": 0, "e": "Many disciplines working together, acting before harm happens."}}, "scenario": {"title": "The audit plan", "setting": "You are asked to plan an ethical audit of a customer-service chatbot.", "steps": [{"prompt": "Which three checks should the audit include, based on the chapter's exercise?", "choices": [{"t": "Bias testing, an explainability review and a privacy assessment", "s": 2, "fb": "Right. Those three come straight from the chapter's audit exercise."}, {"t": "Colour scheme, font and logo", "s": 0, "fb": "Those are design choices, not ethical checks."}, {"t": "Only a speed test", "s": 0, "fb": "Speed is not an ethical check."}]}, {"prompt": "Who should be on the audit team?", "choices": [{"t": "Only the developers who built it", "s": 1, "fb": "They know the system, but governance needs several disciplines."}, {"t": "A mix: developers, legal and ethics specialists, customer-service staff and customer representatives", "s": 2, "fb": "Right. Multidisciplinary collaboration."}, {"t": "Nobody: the chatbot can check itself", "s": 0, "fb": "A system cannot audit itself."}]}]}, "lab": {"t": "Build a chatbot audit", "u": "../labs/checklist/index.html#audit", "d": "Use the audit builder to create a mock ethical audit with bias testing, an explainability review and a privacy assessment."}}], "test": [{"q": "Where can ethical challenges in AI start?", "o": ["Only after launch", "Anywhere from data collection to deployment", "Only in testing"], "a": 1, "e": "Challenges span the whole lifecycle.", "lesson": 0}, {"q": "A voice assistant trained mostly on one accent works poorly for others. What is the cause?", "o": ["Unrepresentative data", "Slow processors", "Too much transparency"], "a": 0, "e": "Data that under-represents some groups leads to bias.", "lesson": 1}, {"q": "How can bias reinforce systemic discrimination?", "o": ["Unfair decisions feed back into future data", "It cannot", "By making systems faster"], "a": 0, "e": "Today's unfair decisions become tomorrow's data.", "lesson": 1}, {"q": "Why is accountability hard for black-box AI in high-stakes uses?", "o": ["It is too cheap", "It is hard to see why decisions were made", "It always explains itself"], "a": 1, "e": "Without reasons, mistakes and responsibility are hard to pin down.", "lesson": 2}, {"q": "A shop uses cameras to identify returning customers without telling them. Which challenge is this?", "o": ["Privacy and lack of consent", "Adaptive bias", "Explainability only"], "a": 0, "e": "Surveillance without consent is a privacy threat.", "lesson": 3}, {"q": "A recommendation system becomes unfair months after launch as it keeps learning. What is this called?", "o": ["Symbolic AI", "Adaptive bias", "Beneficence"], "a": 1, "e": "Systems that keep learning can drift into new bias.", "lesson": 4}, {"q": "Which fix pairs with privacy and surveillance concerns?", "o": ["Fairness-aware algorithms", "Explainable AI", "Privacy-preserving technologies"], "a": 2, "e": "Privacy-preserving technologies protect personal data.", "lesson": 5}, {"q": "What kind of governance does the chapter call for?", "o": ["Reactive and single-discipline", "Multidisciplinary and proactive", "None"], "a": 1, "e": "Many disciplines working together, acting before harm.", "lesson": 5}]};
</script>
