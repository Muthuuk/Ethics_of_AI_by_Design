<script>
const CH = {"id": "ch01", "num": "1", "title": "The Ethics of AI", "summary": "Why AI needs ethics now, the three classes of AI, the core principles, the main frameworks, and first cases: biased hiring tools and self-driving cars.", "source": "Based on Chapter 1 of Engineering Ethics of AI by Design by Prof Muthu Ramachandran (Springer).", "outcomes": ["Explain why AI ethics matters now, using hiring, healthcare and justice as examples", "Tell narrow AI (ANI) apart from general (AGI) and super AI (ASI)", "Name the core ethical principles and spot which one a problem breaks", "Say what AI Ethics by Design, frameworks, checklists and audits are each for", "Apply the principles to a biased hiring tool and a self-driving car dilemma"], "watch": [{"k": "Video", "t": "Joy Buolamwini: How I'm fighting bias in algorithms (TED)", "u": "https://www.ted.com/talks/joy_buolamwini_how_i_m_fighting_bias_in_algorithms", "d": "A short talk on how face-analysis software failed to see her face, and what she did about it."}, {"k": "Try", "t": "Moral Machine (MIT Media Lab)", "u": "https://www.media.mit.edu/projects/moral-machine/", "d": "Judge self-driving car dilemmas yourself and compare with others."}, {"k": "Read", "t": "EU Ethics Guidelines for Trustworthy AI", "u": "https://digital-strategy.ec.europa.eu/en/library/ethics-guidelines-trustworthy-ai", "d": "The European Commission expert group's guidelines."}, {"k": "Read", "t": "OECD AI Principles", "u": "https://oecd.ai/en/ai-principles", "d": "Principles agreed by OECD member countries and partners."}, {"k": "Try", "t": "Class activities and assignments", "u": "../activities/index.html", "d": "Debates, case analyses, essays and audits for each chapter."}], "starter": [{"q": "Which kind of AI is in use today, in things like sat-navs and spam filters?", "o": ["Super AI (ASI)", "Narrow AI (ANI)", "General AI (AGI)"], "a": 1, "e": ""}, {"q": "A hiring tool learned from past hiring records that mostly came from one group. What is the most likely problem?", "o": ["It will be too slow", "It will favour that group", "It will refuse to work"], "a": 1, "e": ""}, {"q": "What does \"AI Ethics by Design\" mean?", "o": ["Building ethics in from the start of a project", "Checking ethics once the system is finished", "Letting the AI decide what is ethical"], "a": 0, "e": ""}], "lessons": [{"title": "Why AI ethics matters now", "minutes": 2, "slides": [{"scene": "timeline", "steps": [0, 0, 1, 2, 2], "say": ["Welcome to Chapter 1, The Ethics of AI. I'm Sam, your tutor. This course is about building AI that is fair, safe and trustworthy, by designing ethics in from the very start.", "Let's begin with a little history. Early AI was symbolic. People wrote the rules by hand, a bit like a giant recipe book: if this happens, do that.", "Most modern AI is deep learning. Instead of following rules people wrote, it learns patterns from huge amounts of data. That makes it powerful. But it can also learn patterns we would rather it did not, and it is harder to see why it decides what it does.", "Today AI helps make decisions that matter in people's lives. Who gets shortlisted for a job. Which patient is seen first. Who is judged a risk in the justice system.", "When decisions like these go wrong, real people are hurt. That is why ethics is no longer optional. It has to be part of how AI is built."]}], "keyPoint": "AI has moved from rules written by people to systems that learn from data, and it now shapes decisions about jobs, health and justice. That influence on society is why ethics is needed.", "plain": ["Symbolic AI follows rules people wrote. Deep learning learns its own patterns from data.", "AI now affects hiring, healthcare and justice.", "When AI decisions affect people's lives, ethics has to be built in."], "check": {"q": "Why does the chapter say ethics is needed in AI now?", "o": ["Because AI will soon be super-intelligent", "Because AI now influences important decisions in society, such as hiring, healthcare and justice", "Because computers are much faster than before"], "a": 1, "e": "The chapter ties the need for ethics to AI's influence on society today, with hiring, healthcare and justice as examples.", "retry": {"q": "Which of these does the chapter give as an area where AI has real-world impact?", "o": ["Choosing paint colours", "Hiring decisions", "Predicting the weather on Mars"], "a": 1, "e": "Hiring, healthcare and justice are the three areas named."}}, "scenario": {"title": "The dinner-table debate", "setting": "Over dinner, a friend says AI ethics is science fiction: something to worry about when robots take over, not today.", "steps": [{"prompt": "What is the best reply?", "choices": [{"t": "AI already helps decide who gets jobs, treatment and justice, so ethics matters today", "s": 2, "fb": "Right. The harm is happening now, through ordinary systems making real decisions."}, {"t": "You are right, it is a problem for the future", "s": 0, "fb": "No. The chapter's examples are all about today: hiring, healthcare and justice."}, {"t": "It matters, but only for big technology companies", "s": 1, "fb": "Partly. Big companies matter, but any organisation using AI for decisions about people needs ethics."}]}, {"prompt": "Your friend asks why modern AI is harder to check than older AI. What do you say?", "choices": [{"t": "It runs on faster computers", "s": 0, "fb": "Speed is not the issue. The issue is how it decides."}, {"t": "It learns its own patterns from data, so its reasons are not written down as rules", "s": 2, "fb": "Right. Symbolic AI followed written rules. Deep learning finds patterns itself, which are harder to see and explain."}, {"t": "It has no data at all", "s": 0, "fb": "No. Deep learning depends on large amounts of data."}]}]}}, {"title": "Narrow, general and super AI", "minutes": 2, "slides": [{"scene": "pyramid", "steps": [0, 1, 1, 2, 0], "say": ["AI is often sorted into three classes, by how capable it is. Think of a pyramid with three levels.", "At the base is narrow AI, or ANI. It does one task, or a small set of tasks. Your sat-nav, your spam filter, face unlock on your phone and translation apps are all narrow AI.", "Every AI system in use today is narrow AI. Even very impressive tools are still built for particular jobs.", "Above that sits general AI, or AGI: a system as capable as a person at almost any task. That is a future idea. At the top is super AI, or ASI, which would go far beyond human ability. That is theoretical, and people mainly discuss its risks.", "Here is the important lesson. The real ethical harms we see today come from narrow AI. So ethics is not about waiting for super-intelligence. It is about the ordinary systems we already use."]}], "keyPoint": "All AI in use today is narrow AI (ANI). General AI (AGI) is a future idea and super AI (ASI) is theoretical. Today's ethical problems come from narrow AI.", "plain": ["ANI does one task. Examples: sat-nav, spam filter, face unlock.", "AGI would match a person at most tasks. It does not exist yet.", "ASI would go beyond people. It is a theory, discussed mainly for its risks."], "activity": {"type": "sort", "title": "Sort the AI", "prompt": "Which class does each one belong to?", "buckets": [{"t": "ANI · Narrow", "d": "One task. In use today."}, {"t": "AGI · General", "d": "Human-level. Future."}, {"t": "ASI · Super", "d": "Beyond human. Theoretical."}], "items": [{"t": "A sat-nav that plans your route", "b": 0}, {"t": "An email spam filter", "b": 0}, {"t": "A system as capable as a person at almost any task", "b": 1}, {"t": "Face unlock on a phone", "b": 0}, {"t": "An AI far beyond human ability in every area", "b": 2}, {"t": "A film-suggestion engine", "b": 0}, {"t": "A translation app", "b": 0}], "explain": "Everything you can use today is narrow AI, however clever it seems."}, "check": {"q": "A hospital tool reads chest X-rays and does nothing else. Which class of AI is it?", "o": ["General AI (AGI)", "Super AI (ASI)", "Narrow AI (ANI)"], "a": 2, "e": "It does one specific task, so it is narrow AI, like every AI system in use today.", "retry": {"q": "Which statement about AGI matches the chapter?", "o": ["It is a future idea: human-equivalent intelligence", "It is already in every smartphone", "It means AI that does one task well"], "a": 0, "e": "AGI is described as human-equivalent intelligence, in the future."}}, "scenario": {"title": "The sales pitch", "setting": "A supplier tells your team: \"Our new assistant is basically general AI, so the usual ethics checks don't really apply to it.\"", "steps": [{"prompt": "How do you respond?", "choices": [{"t": "Agree: general AI is beyond normal checks", "s": 0, "fb": "No. And in any case, more capable AI would need more checks, not fewer."}, {"t": "It is narrow AI built for particular tasks, so it needs the same checks as any other system", "s": 2, "fb": "Right. All AI in use today is narrow AI, and today's real harms come from it."}, {"t": "Ask for a discount instead", "s": 0, "fb": "That avoids the real question about checks."}]}, {"prompt": "A colleague asks where ethics effort should go first. What do you suggest?", "choices": [{"t": "On the narrow AI systems we already use for real decisions", "s": 2, "fb": "Right. That is where people can be harmed today."}, {"t": "On preparing for super AI", "s": 1, "fb": "Long-term risks are worth discussing, but the chapter's cases show today's harms come from narrow AI."}, {"t": "Nowhere until AGI arrives", "s": 0, "fb": "No. Waiting ignores the harm that narrow AI can already do."}]}]}}, {"title": "The core ethical principles", "minutes": 3, "slides": [{"scene": "spheres", "opts": {"names": ["Transparency", "Fairness", "Accountability", "Privacy", "Do good, do no harm"], "subs": ["Open and explainable", "No discrimination", "Answerable, with oversight", "Data protection", "Beneficence and non-maleficence"]}, "steps": [-1, 0, 1, 2, 3, 4, 5], "say": ["Responsible AI rests on a small set of core principles. Picture them as five overlapping spheres. They overlap because real problems usually touch more than one.", "Transparency and explainability. People should be able to see how an AI reaches its decisions, and get an explanation they can understand. Think of a doctor who cannot find out why an AI flagged a scan. That is a transparency failure.", "Fairness and non-discrimination. AI should not treat people worse because of who they are. Facial recognition that works less well for some groups of people is a well-known example of unfairness.", "Accountability and oversight. Someone must be answerable for what the AI does, and people must be able to check it and step in.", "Privacy and data protection. Personal data should be protected, and used only in ways people have agreed to.", "Beneficence and non-maleficence. These are old words from medical ethics. Beneficence means doing good. Non-maleficence means doing no harm.", "Together, these principles are the yardstick for every AI system in this course."]}], "keyPoint": "Five core principles: transparency and explainability, fairness and non-discrimination, accountability and oversight, privacy and data protection, and beneficence and non-maleficence (do good, do no harm).", "plain": ["Transparency: can people see and understand how it decides?", "Fairness: does it treat everyone fairly? Accountability: who answers for it?", "Privacy: is personal data protected? Do good, do no harm: does it help without hurting?"], "activity": {"type": "sort", "title": "Which principle is at risk?", "prompt": "Put each problem under the principle it breaks most clearly.", "buckets": [{"t": "Transparency"}, {"t": "Fairness"}, {"t": "Accountability"}, {"t": "Privacy"}, {"t": "Do no harm"}], "items": [{"t": "A doctor cannot find out why the AI flagged a scan", "b": 0}, {"t": "Face recognition works less well for some groups", "b": 1}, {"t": "Nobody can say who is responsible when the AI gets it wrong", "b": 2}, {"t": "An app shares health data without asking", "b": 3}, {"t": "A tool saves time but quietly puts some patients at risk", "b": 4}], "explain": "Real cases often touch several principles. Here each one has a clearest match."}, "check": {"q": "An AI tool refuses a loan and nobody can explain why. Which principle is most clearly broken?", "o": ["Privacy", "Transparency and explainability", "Beneficence"], "a": 1, "e": "When a decision cannot be explained, transparency and explainability are missing.", "retry": {"q": "What does non-maleficence mean?", "o": ["Do no harm", "Do it quickly", "Do it cheaply"], "a": 0, "e": "Non-maleficence means doing no harm. Beneficence means doing good."}}, "scenario": {"title": "The face-recognition pilot", "setting": "Your council is testing face recognition at a library entrance. Staff notice it fails to recognise some visitors far more often than others.", "steps": [{"prompt": "Which principle does this raise first?", "choices": [{"t": "Fairness and non-discrimination", "s": 2, "fb": "Right. A system that works worse for some groups treats them unfairly."}, {"t": "Beneficence", "s": 1, "fb": "Partly. The system is not doing good for everyone, but the clearest issue is unfair treatment."}, {"t": "None: every system makes mistakes", "s": 0, "fb": "Mistakes that fall more on some groups than others are an ethical problem, not just a technical one."}]}, {"prompt": "Visitors ask how their face data is stored and who sees it. Nobody knows. What else is at risk?", "choices": [{"t": "Privacy and data protection, and transparency", "s": 2, "fb": "Right. People's data must be protected, and they should be told how it is used."}, {"t": "Nothing else", "s": 0, "fb": "No. Not knowing how personal data is handled is a privacy and transparency problem."}, {"t": "Only the budget", "s": 0, "fb": "Cost matters, but this question is about people's data and their right to know."}]}]}}, {"title": "Frameworks and governance", "minutes": 2, "slides": [{"scene": "stack", "steps": [0, 1, 1, 2, 3], "say": ["Principles tell us what matters. But how do we actually put them into practice? That is the job of frameworks and governance. Picture three layers.", "At the bottom are the principles you just met. In the middle are frameworks and guidelines that spell out what the principles mean in practice. Examples are the European Union's Guidelines for Trustworthy AI, and frameworks from IEEE, the engineering professional body, and the OECD, a group of governments.", "Different regions write their guidelines in different ways. It is worth comparing them, and asking whether a guideline is advice or a binding rule. We will look at this closely in Chapter 3.", "On top are the practical tools: checklists to make sure nothing is missed, and audits that check what was actually done.", "And running through all three layers is AI Ethics by Design: a method for building ethics into a system from the first idea, not bolting it on at the end."]}], "keyPoint": "Frameworks turn principles into practice. AI Ethics by Design is the method; the EU, IEEE and OECD give guidance; checklists and audits are the tools.", "plain": ["Principles say what matters. Frameworks say what it means in practice.", "Checklists make sure nothing is missed. Audits check what was really done.", "Ethics by Design builds ethics in from the start."], "check": {"q": "Which of these is an implementation tool rather than a framework?", "o": ["The EU Guidelines for Trustworthy AI", "An ethics checklist", "The OECD framework"], "a": 1, "e": "Checklists and audits are the practical tools. The EU, IEEE and OECD documents are frameworks and guidelines.", "retry": {"q": "What is AI Ethics by Design?", "o": ["A method for building ethics in from the start", "A law passed in one country", "A type of AI chip"], "a": 0, "e": "It is a design method that builds ethics in from the first idea."}}, "scenario": {"title": "Where do we start?", "setting": "Your small company is about to build its first AI product. The manager asks how to \"do ethics\" properly.", "steps": [{"prompt": "What should come first?", "choices": [{"t": "Agree the principles you will follow, then plan how to build them in from day one", "s": 2, "fb": "Right. That is Ethics by Design: principles first, built in from the start."}, {"t": "Build the product, then run an ethics check at the end", "s": 0, "fb": "Ethics added at the end often comes too late to change the design."}, {"t": "Buy a certificate", "s": 0, "fb": "There is no shortcut. The work has to be part of the design."}]}, {"prompt": "A colleague found two guidelines from different regions that say things in different ways. What do you advise?", "choices": [{"t": "Ignore both", "s": 0, "fb": "They contain useful guidance. Ignoring them throws that away."}, {"t": "Compare them, and check which are advice and which are binding rules where you operate", "s": 2, "fb": "Right. Regional guidelines differ, and it matters whether one is advice or law."}, {"t": "Pick the shorter one", "s": 1, "fb": "Shorter is not the same as better. Compare what each requires."}]}]}}, {"title": "Case: bias in a hiring algorithm", "minutes": 2, "slides": [{"scene": "pipeline", "opts": {"inLabel": "Past hiring records", "groups": ["Group A", "Group B"]}, "steps": [0, 1, 1, 2, 2], "say": ["Let's look at our first case: an AI tool that screens job applications. It learns from the company's past hiring records to predict who will be a good hire.", "Now suppose the company has mostly hired people from one group in the past. The records the AI learns from are lopsided. Watch what happens in the scene.", "The AI learns that people like past hires are good candidates. Nobody told it to favour one group. It simply copied the pattern in the data. So applicants from the other group are shortlisted far less often.", "And there is a loop. If the biased shortlists lead to more hires from the same group, tomorrow's records are even more lopsided.", "Ask yourself what you would do differently. Check the data before training. Test the results for each group. And keep a person responsible for the final decision."]}], "keyPoint": "A hiring tool trained on lopsided past records copies the old pattern and can shut out whole groups, even though nobody told it to. Check the data, test the results for each group, and keep a person responsible.", "plain": ["The AI learns from past hiring records.", "If the past favoured one group, the AI will too.", "Check the data, test outcomes for every group, and keep a human in charge."], "check": {"q": "A hiring AI favours one group, although nobody programmed it to. What is the most likely cause?", "o": ["The applicants wrote poor CVs", "The computer was too slow", "It learned from past records that were lopsided"], "a": 2, "e": "AI learns patterns from its data. If past hiring favoured one group, the AI copies that pattern.", "retry": {"q": "Why can hiring bias get worse over time?", "o": ["Biased hires become the next round of training data", "AI gets tired", "Applicants stop applying online"], "a": 0, "e": "Unfair decisions feed tomorrow's records, which teach the AI the same pattern again."}}, "scenario": {"title": "The shortlist", "setting": "You are an HR manager. A new AI tool has shortlisted 20 people for interview. Almost all of them come from the same background as your current staff.", "steps": [{"prompt": "What do you do first?", "choices": [{"t": "Pause, and compare shortlist rates for different groups of applicants", "s": 2, "fb": "Right. Measuring the outcomes for each group is how you find out whether the tool is fair."}, {"t": "Go ahead: the AI is objective", "s": 0, "fb": "AI is only as fair as the data it learned from."}, {"t": "Quietly add a few names from other groups", "s": 1, "fb": "Your aim is right, but it hides the problem rather than fixing the tool."}]}, {"prompt": "The tool's supplier says the data is \"just history\". What should you ask for?", "choices": [{"t": "Nothing; history is history", "s": 0, "fb": "History can carry old unfairness. That is exactly what the tool may be repeating."}, {"t": "A free upgrade", "s": 0, "fb": "That does not address the bias."}, {"t": "Details of the training data, and results tested for each group", "s": 2, "fb": "Right. You need to see what the tool learned from and how it performs for everyone."}]}]}, "lab": {"t": "Try the loan approval bias lab", "u": "../labs/loan-bias/index.html", "d": "See the same effect yourself: make the training data lopsided, then apply a fairness fix."}}, {"title": "Self-driving cars and the ethics checklist", "minutes": 3, "slides": [{"scene": "orbit", "opts": {"core": "Self-driving car", "names": ["Passengers", "Pedestrians", "Developers", "The car maker", "Regulators"], "msg": "Every circle has a stake in how the car is designed"}, "steps": [-1, 1, 2, 5], "say": ["Our second case is the self-driving car. Imagine a sudden emergency on the road, where every option carries some risk. How should the car be designed to act?", "There is no perfect answer. Passengers, pedestrians and other road users all have a stake.", "And someone has to answer for the design choices: the developers, the car maker and the regulators who approve it. These are accountability questions, not just technical ones.", "Thinking about everyone affected is the first step. Then you need a way to decide quickly and carefully."]}, {"scene": "ladder", "opts": {"steps": [["Ask", "Who could be harmed?"], ["Check", "Which principles are at risk?"], ["Decide", "Choose, and record why"], ["Review", "Check the result and improve"]], "head": "From a quick question to a planned roadmap"}, "steps": [0, 1, 2, 3, 3], "say": ["Chapter 1 of the book offers a short set of Emergency Ethics Questions for moments like this. Your class can use them as quick decision drills. Start simply: who could be harmed?", "Then check which principles are at risk. Fairness? Transparency? Accountability? Privacy? Harm?", "Decide, and write down why. A written reason can be checked later.", "Finally, review what happened and improve. An ethics checklist and an implementation roadmap make this a habit across a whole project, not a one-off.", "So the tools of this chapter are simple: think about everyone affected, use quick ethics questions, follow a checklist, and plan the steps on a roadmap."]}], "keyPoint": "Self-driving cars raise hard choices that affect many people. Quick ethics questions, a checklist and an implementation roadmap help teams decide carefully and record why.", "plain": ["Many people have a stake: passengers, pedestrians, makers and regulators.", "Ask who could be harmed and which principles are at risk.", "Decide, write down why, then review. A checklist and roadmap make it a habit."], "check": {"q": "Why should a team write down the reason for an ethical design decision?", "o": ["So the decision can be checked and improved later", "To make the project longer", "Because the law always requires a novel"], "a": 0, "e": "Recording the reason supports accountability and lets the team review and improve.", "retry": {"q": "What does an implementation roadmap add to an ethics checklist?", "o": ["A plan of steps across the whole project", "A faster computer", "A legal guarantee"], "a": 0, "e": "A roadmap turns one-off checks into a planned set of steps."}}, "scenario": {"title": "The design review", "setting": "You are on a team designing how a self-driving car reacts in emergencies. The deadline is close and a colleague suggests skipping the ethics discussion.", "steps": [{"prompt": "What do you say?", "choices": [{"t": "Skip it; the engineers know best", "s": 0, "fb": "Engineers matter, but passengers, pedestrians and regulators all have a stake."}, {"t": "Take ten minutes for the quick ethics questions: who could be harmed, and which principles are at risk", "s": 2, "fb": "Right. Quick questions keep ethics in the room even under time pressure."}, {"t": "Postpone the whole project", "s": 1, "fb": "Sometimes a pause is right, but a short structured check is usually the better first step."}]}, {"prompt": "The team makes a decision. What should happen next?", "choices": [{"t": "Record the reasons, and plan a review on the roadmap", "s": 2, "fb": "Right. Written reasons and planned reviews support accountability."}, {"t": "Keep it secret", "s": 0, "fb": "Hidden decisions cannot be checked or improved."}, {"t": "Never discuss it again", "s": 0, "fb": "Decisions should be reviewed as you learn more."}]}]}}], "test": [{"q": "A friend says AI ethics only matters once machines are super-intelligent. Which reply fits the chapter?", "o": ["Today's narrow AI already affects hiring, healthcare and justice", "Correct, we can wait", "Ethics only applies to robots"], "a": 0, "e": "The chapter's examples are about today's narrow AI.", "lesson": 0}, {"q": "How does deep learning differ from symbolic AI?", "o": ["It follows rules people wrote by hand", "It learns patterns from data", "It has no connection to data"], "a": 1, "e": "Symbolic AI follows rules people wrote. Deep learning learns from data.", "lesson": 0}, {"q": "A spam filter is an example of which class of AI?", "o": ["Super AI (ASI)", "General AI (AGI)", "Narrow AI (ANI)"], "a": 2, "e": "It does one task, so it is narrow AI.", "lesson": 1}, {"q": "Patients ask how a hospital AI uses their records and get no answer. Which two principles are most at risk?", "o": ["Privacy and transparency", "Beneficence and speed", "Fairness and cost"], "a": 0, "e": "Personal data must be protected, and people should be told how it is used.", "lesson": 2}, {"q": "What are checklists and audits, in the chapter's terms?", "o": ["Laws", "Implementation tools", "Classes of AI"], "a": 1, "e": "They are the practical tools on top of principles and frameworks.", "lesson": 3}, {"q": "A hiring tool trained on years of records favours one group. What should the company do first?", "o": ["Trust the tool", "Delete all records", "Test shortlist rates for each group and check the training data"], "a": 2, "e": "Measuring outcomes for each group and checking the data shows whether the tool is fair.", "lesson": 4}, {"q": "In a self-driving car emergency design, who has a stake?", "o": ["Only the passengers", "Passengers, pedestrians, developers, the car maker and regulators", "Only the software"], "a": 1, "e": "Many people are affected, and several are accountable.", "lesson": 5}]};
